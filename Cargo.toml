[package]
name = "revu"
version = "0.1.0"
edition = "2024"
description = "Terminal UI to triage and review GitHub pull requests, with inline comments and language-server navigation"
authors = ["Alexandre Pilleyre"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexpill/revu"
readme = "README.md"
keywords = ["github", "code-review", "pull-request", "tui", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# regex-fancy keeps the build pure Rust (no oniguruma C dependency)
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
# bat's extra syntaxes (TypeScript, TOML, Nix...) and themes
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
toml = "1"
